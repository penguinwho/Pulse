<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse</title><style>:root{--p:#7764f4;--dark:#252839;--line:#e6e7ef;--muted:#767b8d}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#202331}.app{display:grid;grid-template-columns:250px 1fr;height:100%}.side{background:var(--dark);color:#c5c8d6;padding:22px 14px;display:flex;flex-direction:column}.brand{font-weight:850;font-size:21px;color:#fff;margin:0 8px 27px}.space{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#9297ad;margin:17px 8px 8px}.channel{display:flex;align-items:center;gap:7px;padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer}.channel:hover,.channel.active{background:#424557;color:#fff}.add{margin-left:auto;background:transparent;color:#c5c8d6;font-size:17px}.profile{margin-top:auto;border-top:1px solid #424557;padding:15px 8px 3px;display:flex;align-items:center;gap:9px}.avatar{width:31px;height:31px;border-radius:10px;background:#d9f45d;color:#333;display:grid;place-items:center;font-weight:800}.profile small{display:block;color:#969aae;font-size:11px}.logout{margin-left:auto;background:none;color:#bbbfd0;font-size:12px}.main{display:flex;flex-direction:column;background:#fff}.head{height:65px;border-bottom:1px solid var(--line);padding:0 26px;display:flex;align-items:center;font-weight:800}.head span{font-weight:500;color:#9297a6;font-size:13px;margin-left:10px}.messages{flex:1;overflow:auto;padding:20px 8%;}.welcome{margin:25px 0 33px}.welcome h1{font-size:29px;letter-spacing:-.05em;margin:0 0 6px}.welcome p{margin:0;color:var(--muted)}.msg{display:flex;gap:11px;margin:18px 0}.msg .avatar{background:#eeeaff;font-size:12px}.msg.me .avatar{background:#d9f45d}.bubble strong{font-size:14px}.bubble time{font-size:11px;color:#9ba0b0;margin-left:6px}.bubble p{margin:4px 0 0;line-height:1.45;color:#555b6d}.compose{margin:0 8% 22px;display:flex;gap:9px;border:1px solid var(--line);border-radius:12px;padding:7px;background:#fafaff}.compose input{border:0;outline:0;flex:1;padding:8px;background:transparent;font:inherit}.compose button{border:0;border-radius:8px;background:var(--p);color:#fff;padding:8px 13px;font-weight:750}.empty{color:#969bad;font-size:13px}@media(max-width:650px){.app{grid-template-columns:72px 1fr}.side{padding:20px 8px}.brand{font-size:0;margin:0 auto 22px}.brand:after{content:'✦';font-size:25px}.channel{font-size:0;justify-content:center}.channel:before{content:'#';font-size:17px}.space,.profile div,.logout{display:none}.messages{padding:15px 5%}.compose{margin:0 5% 16px}}</style></head><body><div class="app"><aside class="side"><div class="brand">✦ pulse</div><div class="space">My space <button class="add" onclick="newChannel()">+</button></div><div id="channels"><div class="channel active" data-channel="lounge"># lounge</div><div class="channel" data-channel="ideas"># ideas</div><div class="channel" data-channel="music-room"># music-room</div></div><div class="profile"><div class="avatar" id="initial">P</div><div><b id="user"></b><small>online</small></div><button class="logout" onclick="localStorage.removeItem('pulseUser');location.href='index.html'">Log out</button></div></aside><main class="main"><header class="head" id="title"># lounge <span>the general hangout</span></header><section class="messages" id="messages"></section><form class="compose" id="composer"><input id="input" autocomplete="off" placeholder="Message # lounge"><button>Send</button></form></main></div><script>const user=localStorage.getItem('pulseUser');if(!user)location.href='signin.html';document.querySelector('#user').textContent=user;initial.textContent=user[0].toUpperCase();let channel='lounge';const msgs=JSON.parse(localStorage.getItem('pulseMessages')||'{"lounge":[{"name":"Sam","text":"Good morning, wonderful people. Who’s up for a tiny co-work sprint?"},{"name":"Mira","text":"I’m in! Sharing the playlist I’ve had on repeat."}],"ideas":[{"name":"Arlo","text":"What should we build together next?"}],"music-room":[{"name":"Nia","text":"Drop your current repeat here 🎧"}]}');function render(){title.innerHTML='# '+channel+' <span>'+({lounge:'the general hangout',ideas:'make it real', 'music-room':'sounds for the moment'})[channel]+'</span>';input.placeholder='Message # '+channel;messages.innerHTML='<div class="welcome"><h1>Welcome to # '+channel+'</h1><p>This is the start of the '+channel+' conversation.</p></div>'+(msgs[channel]||[]).map(m=>'<div class="msg '+(m.name===user?'me':'')+'"><div class="avatar">'+m.name[0]+'</div><div class="bubble"><strong>'+m.name+'</strong><time> just now</time><p>'+m.text.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))+'</p></div></div>').join('');messages.scrollTop=messages.scrollHeight}document.querySelector('#channels').onclick=e=>{const c=e.target.closest('.channel');if(!c)return;document.querySelectorAll('.channel').forEach(x=>x.classList.remove('active'));c.classList.add('active');channel=c.dataset.channel;render()};composer.onsubmit=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;(msgs[channel]??=[]).push({name:user,text});localStorage.setItem('pulseMessages',JSON.stringify(msgs));input.value='';render()};function newChannel(){const n=prompt('Name your channel (letters, numbers, hyphens):');if(!n)return;const key=n.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-');if(!key)return;if(!msgs[key])msgs[key]=[];localStorage.setItem('pulseMessages',JSON.stringify(msgs));channels.insertAdjacentHTML('beforeend','<div class="channel" data-channel="'+key+'"># '+key+'</div>');document.querySelector('[data-channel="'+key+'"]').click()}render()</script></body></html>
