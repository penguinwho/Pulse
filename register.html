<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create a Pulse account</title><style>:root{--p:#7764f4;--ink:#171925;--muted:#73788c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 85% 15%,#e9e4ff,transparent 28%),#f9f9fe;color:var(--ink)}.wrap{width:min(100%,440px)}.brand{font-size:22px;font-weight:850;display:flex;gap:9px;align-items:center;margin-bottom:32px;text-decoration:none;color:var(--ink)}.mark{width:28px;height:28px;border-radius:10px;background:var(--p);transform:rotate(-8deg)}.card{background:#fff;border:1px solid #eaebf3;border-radius:22px;padding:34px;box-shadow:0 20px 60px #31305114}h1{font-size:32px;letter-spacing:-.05em;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 25px}label{font-size:13px;font-weight:750;display:block;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #dfe1ea;border-radius:10px;font:inherit;outline-color:var(--p)}button{width:100%;margin-top:24px;border:0;border-radius:10px;padding:14px;background:var(--p);color:#fff;font:750 15px inherit;cursor:pointer}.note,.legal{font-size:13px;text-align:center;margin:21px 0 0}.legal{font-size:11px;color:#979baa;margin-top:16px}.note a{color:var(--p);font-weight:700;text-decoration:none}.error{min-height:20px;color:#c13c54;font-size:12px;margin-top:10px}</style></head><body><main class="wrap"><a class="brand" href="index.html"><span class="mark"></span>pulse</a><section class="card"><h1>Create your Pulse</h1><p>Start a space for your people in less than a minute.</p><form id="register-form"><label for="account-name">Your name</label><input id="account-name" required maxlength="40" placeholder="Mira Chen" autofocus><label for="account-email">Email</label><input id="account-email" type="email" required placeholder="you@example.com"><label for="account-password">Password</label><input id="account-password" type="password" minlength="6" required placeholder="At least 6 characters"><button>Create account →</button><div class="error" id="form-error" role="alert"></div></form><div class="legal">This demo saves accounts only in this browser.</div><div class="note">Already have an account? <a href="signin.html">Log in</a></div></section></main><script>const form=document.querySelector('#register-form'),nameField=document.querySelector('#account-name'),emailField=document.querySelector('#account-email'),passwordField=document.querySelector('#account-password'),errorBox=document.querySelector('#form-error'),accounts=()=>JSON.parse(localStorage.getItem('pulseAccounts')||'[]'),newId=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);form.addEventListener('submit',event=>{event.preventDefault();const user={id:newId(),name:nameField.value.trim(),email:emailField.value.trim().toLowerCase(),password:passwordField.value},list=accounts();if(list.some(account=>account.email===user.email)){errorBox.textContent='An account with that email already exists. Try logging in.';return}list.push(user);localStorage.setItem('pulseAccounts',JSON.stringify(list));localStorage.setItem('pulseAccount',JSON.stringify(user));localStorage.setItem('pulseUser',user.name);window.location.assign('app.html')});</script></body></html>
