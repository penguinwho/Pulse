<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to Pulse</title><style>:root{--p:#7764f4;--ink:#171925;--muted:#73788c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 85% 15%,#e9e4ff,transparent 28%),#f9f9fe;color:var(--ink)}.wrap{width:min(100%,440px)}.brand{font-size:22px;font-weight:850;display:flex;gap:9px;align-items:center;margin-bottom:32px;text-decoration:none;color:var(--ink)}.mark{width:28px;height:28px;border-radius:10px;background:var(--p);transform:rotate(-8deg)}.card{background:#fff;border:1px solid #eaebf3;border-radius:22px;padding:34px;box-shadow:0 20px 60px #31305114}h1{font-size:32px;letter-spacing:-.05em;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 25px}label{font-size:13px;font-weight:750;display:block;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #dfe1ea;border-radius:10px;font:inherit;outline-color:var(--p)}button{width:100%;margin-top:24px;border:0;border-radius:10px;padding:14px;background:var(--p);color:#fff;font:750 15px inherit;cursor:pointer}.note{font-size:13px;text-align:center;margin:21px 0 0}.note a{color:var(--p);font-weight:700;text-decoration:none}.error{min-height:20px;color:#c13c54;font-size:12px;margin-top:10px}</style></head><body><main class="wrap"><a class="brand" href="index.html"><span class="mark"></span>pulse</a><section class="card"><h1>Welcome back</h1><p>Log in to return to your community.</p><form id="form"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com" autofocus><label for="password">Password</label><input id="password" type="password" required placeholder="Your password"><button>Log in →</button><div class="error" id="error" role="alert"></div></form><div class="note">New to Pulse? <a href="register.html">Create an account</a></div></section></main><script>const form=document.querySelector('#form'),accounts=()=>{const all=JSON.parse(localStorage.getItem('pulseAccounts')||'[]'),old=JSON.parse(localStorage.getItem('pulseAccount')||'null');return all.length?all:(old?[old]:[])};form.onsubmit=e=>{e.preventDefault();const account=accounts().find(a=>a.email===email.value.trim().toLowerCase()&&a.password===password.value);if(!account){error.textContent='That email or password does not match an account on this browser.';return}localStorage.setItem('pulseAccount',JSON.stringify(account));localStorage.setItem('pulseUser',account.name);location.href='app.html'}</script></body></html>
